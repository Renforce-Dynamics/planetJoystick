[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetj-protocol"
version = "0.1.0"
requires-python = ">=3.10"
description = "Compatibility exports for the PLNJ operator protocol"
dependencies = ["planet-protocol>=0.1,<0.2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetj_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetJoystick"
Issues = "https://github.com/Renforce-Dynamics/planetJoystick/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetJoystick#readme"
