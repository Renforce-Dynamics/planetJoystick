[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetj-protocol"
version = "0.1.0"
requires-python = ">=3.10"
description = "planetj-protocol: independent Cadence ecosystem component"
dependencies = ["cadence-protocol>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetj_protocol*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.json", "**/*.xml", "**/*.STL", "**/*.stl", "**/*.onnx", "**/*.npz", "**/*.hex", "**/*.md", "**/*.lock", "**/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetJoystick"
Issues = "https://github.com/Renforce-Dynamics/planetJoystick/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetJoystick#readme"
