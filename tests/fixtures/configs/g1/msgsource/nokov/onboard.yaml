# G1 work profile: Nokov -> estimation -> Rally planning -> publication.
version: 1
transport_config: configs/common/transport/local.yaml

source:
  kind: nokov
  mocap_config: configs/g1/msgsource/nokov/site.yaml
  snapshot_queue_frames: 4096
  raw_queue_frames: 8

recording:
  enabled: true
  directory: recordings
  queue_capacity: 16384
  flush_interval_s: 0.5

perception:
  ball:
    # raw = choose the unlabeled marker inside the configured table volume.
    # role = use a named Nokov rigid body / marker set from site.yaml.
    source: raw
    queue_drain_mode: latest
    use_estimator: true
    estimator_min_samples: 13
    predict_hold_s: 0.20
    bbox_xy_margin_m: 0.30
    bbox_x_min_m: -0.30
    bbox_x_max_m: 1.50
    bbox_z_below_m: 0.00
    bbox_z_above_m: 1.50
    bbox_z_min_m: 0.85
    continuity_radius_m: 0.60
    continuity_hold_s: 0.20
    min_candidate_speed_m_s: 1.00

  base:
    enabled: true
    required: true
    role: robot_pelvis
    use_quat: true
    policy_root_offset_w: [0.0, 0.0, 0.0]
    policy_root_offset_b: [-0.04525, 0.0, 0.08339]
    smoother:
      alpha_pos: 0.30
      alpha_vel: 0.20
      alpha_quat: 0.30
      min_warmup: 5
      max_hold_frames: 10
      max_jump_m: 0.15
      max_speed_mps: 2.0

  racket:
    # Racket tracking is diagnostics-only and never enters the robot packet.
    enabled: true
    role: racket
    # Replace with rigid-origin -> racket contact-centre calibration.
    contact_pos_local_m: [0.0, 0.0, 0.0]
    contact_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
    normal_axis_local: +x

planning:
  robot: g1
  stale_perception_s: 0.10
  target_yaw_w_rad: 0.0
  rally:
    enabled: true
    strategy: single_plane
    config: configs/g1/planner/rally.yaml
