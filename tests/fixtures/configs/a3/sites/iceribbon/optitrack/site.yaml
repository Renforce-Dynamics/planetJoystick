# Stable Iceribbon + OptiTrack definition. Captures and transforms live in JSON.
version: 1
site:
  name: iceribbon

message_source:
  kind: optitrack
  calibration_data: site_optitrack.json
  pose_data: pose_optitrack.json
  connection:
    server_ip: 192.168.5.10
    local_ip: 192.168.5.120
    command_port: 1510
    data_port: 1511
    multicast_address: 239.255.42.99
    use_multicast: true
    connect_timeout_s: 3.0
    socket_timeout_s: 0.10
    requested_version: [4, 2, 0, 0]

mocap:
  max_stale_s: 0.10
  sentinel_threshold: 1.0e+6
  entities:
    Ball: {kind: rigid_body, role: ball_rigid, id: 5}
    table: {kind: rigid_body, role: table_rigid, id: 1}
    P2:
      kind: rigid_body
      role: robot_imu
      id: 0
  transform:
    # NatNet reports metres in this Motive project. Pose is calibration data.
    scale_m_per_unit: 1.0
  ball_observer:
    primary_source: ball_rigid
    fallback_source: null
    fd_vel_max_dt_s: 0.20
    fd_vel_alpha: 0.40
