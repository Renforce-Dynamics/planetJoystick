[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Renforce Dynamics"}]
maintainers = [{name = "Renforce Dynamics"}]
readme = "README.md"
license = {file = "LICENSE"}
name = "planetj"
version = "0.1.0"
requires-python = ">=3.10"
description = "Configurable Linux joystick input"
dependencies = ["planet-config>=0.1,<0.2", "planet-protocol>=0.1,<0.2", "planetj-protocol>=0.1,<0.2"]

[project.scripts]
planetj = "planetj.runtime:main"
planetj-upper = "planetj.upper_stream:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["planetj*"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.json", "**/*.xml", "**/*.STL", "**/*.stl", "**/*.onnx", "**/*.npz", "**/*.hex", "**/*.md", "**/*.lock", "**/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Renforce-Dynamics/planetJoystick"
Issues = "https://github.com/Renforce-Dynamics/planetJoystick/issues"
Documentation = "https://github.com/Renforce-Dynamics/planetJoystick#readme"
